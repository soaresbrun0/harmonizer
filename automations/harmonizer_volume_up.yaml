alias: 'Harmonizer: volume_up'
description: Raise receiver volume while held
triggers:
- domain: mqtt
  device_id: 8679b73f0fe819ef8ba86f5ff4579a92
  type: button_short_press
  subtype: volume_up
  trigger: device
  id: pressed
- domain: mqtt
  device_id: 8679b73f0fe819ef8ba86f5ff4579a92
  type: button_short_release
  subtype: volume_up
  trigger: device
  id: released
conditions:
- condition: template
  value_template: '{{ is_state(media_player, ''on'') }}'
actions:
- choose:
  - conditions:
    - condition: trigger
      id: pressed
    sequence:
    - repeat:
        while:
        - condition: template
          value_template: '{{ (state_attr(media_player, ''volume_level'') | float(0))
            < 1 }}'
        sequence:
        - action: media_player.volume_set
          target:
            entity_id: '{{ media_player }}'
          data:
            volume_level: '{{ (state_attr(media_player, ''volume_level'') | float(0))
              + 0.005 }}'
        - delay:
            seconds: '{{ long_press_delay_in_seconds if repeat.first else repeat_delay_in_seconds
              }}'
  - conditions:
    - condition: trigger
      id: released
    sequence: []
mode: restart
variables:
  media_player: media_player.tx_rz810
  long_press_delay_in_seconds: 0.5
  repeat_delay_in_seconds: 0.1
