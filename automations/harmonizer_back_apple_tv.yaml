alias: 'Harmonizer: back (Apple TV)'
description: 'Tap: back; hold: top menu'
triggers:
- domain: mqtt
  device_id: 8679b73f0fe819ef8ba86f5ff4579a92
  type: button_short_press
  subtype: back
  trigger: device
  id: pressed
- domain: mqtt
  device_id: 8679b73f0fe819ef8ba86f5ff4579a92
  type: button_short_release
  subtype: back
  trigger: device
  id: released
conditions:
- condition: state
  entity_id: media_player.tx_rz810
  state:
  - APPLE TV
  attribute: source
actions:
- choose:
  - conditions:
    - condition: trigger
      id: pressed
    sequence:
    - action: var.set
      data:
        entity_id: '{{ last_pressed_timestamp_var }}'
        value: '{{ as_timestamp(now()) }}'
    - delay:
        seconds: '{{ long_press_delay_in_seconds }}'
    - action: remote.send_command
      data:
        entity_id: '{{ remote }}'
        command: top_menu
  - conditions:
    - condition: trigger
      id: released
    - condition: template
      value_template: '{{ as_timestamp(now()) - (states(last_pressed_timestamp_var)
        | float) < long_press_delay_in_seconds }}'
    sequence:
    - action: remote.send_command
      data:
        entity_id: '{{ remote }}'
        command: menu
mode: restart
variables:
  remote: remote.family_room_apple_tv
  last_pressed_timestamp_var: var.harmonizer_back_last_pressed_timestamp
  long_press_delay_in_seconds: 0.5
