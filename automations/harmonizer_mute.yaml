alias: 'Harmonizer: mute'
description: 'Toggle receiver mute'
triggers:
- domain: mqtt
  device_id: 8679b73f0fe819ef8ba86f5ff4579a92
  type: button_short_press
  subtype: mute
  trigger: device
conditions:
- condition: template
  value_template: "{{ is_state(media_player, 'on') }}"
actions:
- action: media_player.volume_mute
  data:
    is_volume_muted: '{{ is_state_attr(media_player, ''is_volume_muted'', false)
      }}'
    entity_id: '{{ media_player }}'
mode: single
variables:
  media_player: media_player.tx_rz810
