<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>
    <link rel='stylesheet' href='/portal.css'>
    <script>
        function togglePassword() {
            var input = document.getElementById('password');
            var btn = document.getElementById('password_toggle_btn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function validIp(s) {
            s = s.trim();
            if (s === '' || s === '0.0.0.0') return false;
            var parts = s.split('.');
            if (parts.length !== 4) return false;
            for (var i = 0; i < 4; i++) {
                if (!/^\d{1,3}$/.test(parts[i])) return false;
                var n = parseInt(parts[i], 10);
                if (n < 0 || n > 255) return false;
            }
            return true;
        }

        function validateMqtt() {
            var port = parseInt(document.getElementById('port').value.trim(), 10);
            var ok = validIp(document.getElementById('ip_address').value)
                && !isNaN(port) && port >= 1 && port <= 65535;
            document.getElementById('mqtt_next').disabled = !ok;
        }

        function setBadge(id, ready) {
            var el = document.getElementById(id);
            el.textContent = ready ? 'Done' : 'Pending';
            el.className = ready ? 'done' : 'pending';
        }

        function refreshOverview() {
            fetch('/overview')
                .then(response => response.json())
                .then(o => {
                    setBadge('nav-network', o.networkReady);
                    setBadge('nav-smart-hub', o.smartHubReady);
                    setBadge('nav-mqtt', o.mqttReady);
                    var ip = o.mqtt.ipAddress;
                    document.getElementById('ip_address').value = (ip === '0.0.0.0') ? '' : ip;
                    document.getElementById('port').value = o.mqtt.port;
                    document.getElementById('username').value = o.mqtt.username;
                    document.getElementById('password').value = o.mqtt.password;
                    validateMqtt();
                })
                .catch(err => {});
        }

        function attachOverlay() {
            document.querySelectorAll('form').forEach(function(f) {
                f.addEventListener('submit', function() {
                    document.getElementById('page-overlay').classList.remove('hidden');
                });
            });
            // Browser Back restores the submitted page from cache with the
            // overlay still visible; hide it whenever the page is shown.
            window.addEventListener('pageshow', function() {
                document.getElementById('page-overlay').classList.add('hidden');
            });
        }

        window.onload = function() { refreshOverview(); attachOverlay(); };
    </script>
</head>
<body>
    <div class="container">
        <div id="page-overlay" class="overlay hidden"><div class="spinner"></div></div>
        <h2>Step 3 - MQTT</h2>
        <div class='steps'>
            <a href='/network'>1. Network <span id='nav-network' class='pending'>...</span></a>
            <a href='/smart-hub'>2. Smart Hub <span id='nav-smart-hub' class='pending'>...</span></a>
            <a href='/mqtt' class='active'>3. MQTT <span id='nav-mqtt' class='pending'>...</span></a>
            <a href='/review'>4. Review</a>
        </div>
        <form action='/mqtt/save' method='POST'>
            <label for='ip_address'>Broker IP Address:</label>
            <input type='text' id='ip_address' name='ipAddress' placeholder='e.g. 192.168.1.10' autocomplete='off' autocapitalize='off' spellcheck='false' oninput='validateMqtt()'>
            <label for='port'>Port:</label>
            <input type='text' id='port' name='port' placeholder='e.g. 1883' autocomplete='off' inputmode='numeric' oninput='validateMqtt()'>
            <label for='username'>Username (optional):</label>
            <input type='text' id='username' name='username' placeholder='Broker username' autocomplete='off' autocapitalize='off' spellcheck='false'>
            <label for='password'>Password (optional):</label>
            <div class="scan-row">
                <input type='password' id='password' name='password' placeholder='Broker password'>
                <button type="button" id="password_toggle_btn" class="btn" onclick="togglePassword()">Show</button>
            </div>
            <input type='submit' id='mqtt_next' value='Next' disabled>
        </form>

    </div>
</body>
</html>
